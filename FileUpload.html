<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #drop_zone {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      color: #666;
      transition: border-color 0.3s;
    }

    #drop_zone.dragover {
      border-color: #3367d6;
    }

    p {
      margin: 5px 0;
    }

    .link-btn {
      background: none;
      border: none;
      padding: 0;
      color: #3367d6;
      font-size: 0.85em;
      cursor: pointer;
      text-decoration: underline;
    }

    #manageList {
      margin-top: 6px;
    }

    .card-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 0.9em;
    }

    .card-chip button {
      border: none;
      background: none;
      color: #c00;
      cursor: pointer;
      font-size: 1em;
      line-height: 1;
    }

    .muted {
      color: #999;
    }
  </style>
</head>

<body>
  <label for="cardSelect">Card:</label>
  <select id="cardSelect" onchange="handleCardChange()"
    style="width: 100%; box-sizing: border-box; margin-bottom: 6px;">
    <option value="" disabled selected>Loading cards…</option>
  </select>

  <div id="newCardRow" style="display: none; margin-bottom: 6px;">
    <input type="text" id="newCardName" placeholder="New card name"
      style="width: 68%; box-sizing: border-box;" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewCard();}" />
    <button onclick="addNewCard()" style="width: 28%;">Add</button>
  </div>

  <div style="margin-bottom: 10px;">
    <button type="button" class="link-btn" onclick="toggleManage()">Manage cards</button>
    <div id="manageList" style="display: none;"></div>
  </div>

  <div id="drop_zone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)"
    ondrop="handleFileDrop(event)">
    <p>Drag & drop a CSV file here</p>
    <p>or</p>
    <input type="file" id="csvFile" accept=".csv" onchange="handleFileSelect(event)" />
  </div>

  <div style="margin-top: 10px; text-align: center;">
    <button onclick="runConnectionTest()" style="font-size: 0.8em; color: #666; cursor: pointer;">Test Server
      Connection</button>
  </div>

  <script>
    function runConnectionTest() {
      alert("Testing connection...");
      google.script.run
        .withSuccessHandler(msg => alert(msg))
        .withFailureHandler(err => alert("Test Failed: " + err.message))
        .testConnection();
    }

    const dropZone = document.getElementById('drop_zone');
    const fileInput = document.getElementById('csvFile');
    const cardSelect = document.getElementById('cardSelect');
    const newCardName = document.getElementById('newCardName');
    const newCardRow = document.getElementById('newCardRow');
    const manageList = document.getElementById('manageList');

    const NEW_CARD_VALUE = '__new__';

    // The dropdown is a fixed set of pinned defaults plus the user's added cards,
    // served by getCardNames() — it is NOT derived from the sheet tabs, so stray
    // tabs never appear. `custom` are the removable ones.
    let customCards = [];

    function loadCards() {
      google.script.run
        .withSuccessHandler(applyCardLists)
        .withFailureHandler(() => applyCardLists({ defaults: [], custom: [] }))
        .getCardNames();
    }

    // Repaints both the dropdown and the manage list from a {defaults, custom}
    // payload, preserving the current selection when possible.
    function applyCardLists(lists) {
      const defaults = (lists && lists.defaults) || [];
      customCards = (lists && lists.custom) || [];
      const previous = cardSelect.value;

      cardSelect.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.selected = true;
      placeholder.textContent = 'Select a card…';
      cardSelect.appendChild(placeholder);

      defaults.concat(customCards).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        cardSelect.appendChild(opt);
      });

      const newOpt = document.createElement('option');
      newOpt.value = NEW_CARD_VALUE;
      newOpt.textContent = '+ New card…';
      cardSelect.appendChild(newOpt);

      // Restore selection if it still exists.
      if (previous && previous !== NEW_CARD_VALUE) {
        cardSelect.value = previous;
      }
      handleCardChange();
      renderManageList();
    }

    function handleCardChange() {
      const isNew = cardSelect.value === NEW_CARD_VALUE;
      newCardRow.style.display = isNew ? 'block' : 'none';
      if (isNew) newCardName.focus();
    }

    function addNewCard() {
      const name = newCardName.value.trim();
      if (!name) { newCardName.focus(); return; }
      google.script.run
        .withSuccessHandler(lists => {
          newCardName.value = '';
          applyCardLists(lists);
          cardSelect.value = name; // select the freshly added card
          handleCardChange();
        })
        .withFailureHandler(err => alert(err.message))
        .addCard(name);
    }

    function toggleManage() {
      manageList.style.display = (manageList.style.display === 'none') ? 'block' : 'none';
    }

    // Only user-added cards are removable; the pinned defaults have no ✕.
    function renderManageList() {
      manageList.innerHTML = '';
      if (customCards.length === 0) {
        const note = document.createElement('div');
        note.className = 'muted';
        note.style.fontSize = '0.85em';
        note.textContent = 'No removable cards. The four built-in cards are permanent.';
        manageList.appendChild(note);
        return;
      }
      customCards.forEach(name => {
        const row = document.createElement('div');
        row.className = 'card-chip';
        const label = document.createElement('span');
        label.textContent = name;
        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '✕';
        del.title = 'Remove from dropdown (keeps the tab and its data)';
        del.onclick = () => removeCardUI(name);
        row.appendChild(label);
        row.appendChild(del);
        manageList.appendChild(row);
      });
    }

    function removeCardUI(name) {
      google.script.run
        .withSuccessHandler(lists => {
          applyCardLists(lists);
          manageList.style.display = 'block'; // keep the manage panel open
        })
        .withFailureHandler(err => alert(err.message))
        .removeCard(name);
    }

    // Resolves the chosen card. The new-card box is committed via the Add button,
    // so a valid selection is always a real card name in the dropdown.
    function resolveCardName() {
      const v = cardSelect.value;
      if (!v || v === NEW_CARD_VALUE) return '';
      return v;
    }

    loadCards();

    function handleDragOver(event) {
      event.stopPropagation();
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
      dropZone.classList.add('dragover');
    }

    function handleDragLeave(event) {
      event.stopPropagation();
      event.preventDefault();
      dropZone.classList.remove('dragover');
    }

    function handleFileDrop(event) {
      event.stopPropagation();
      event.preventDefault();
      dropZone.classList.remove('dragover');
      const files = event.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        uploadFile(files[0]);
      }
    }

    function handleFileSelect(event) {
      const files = event.target.files;
      if (files.length > 0) {
        uploadFile(files[0]);
      }
    }

    function uploadFile(file) {
      const cardName = resolveCardName();
      if (!cardName) {
        alert('Please pick a card from the dropdown first. To use a new card, choose "+ New card…", type its name, and click Add.');
        fileInput.value = "";
        return;
      }

      // Check file size (limit to 10MB to be safe, GAS limit is technically higher but transport is fragile)
      const MAX_SIZE = 10 * 1024 * 1024;
      if (file.size > MAX_SIZE) {
        alert('File is too large. Please upload a file smaller than 10MB.');
        fileInput.value = "";
        return;
      }

      if (file && file.name.toLowerCase().endsWith('.csv')) {
        const reader = new FileReader();
        reader.onload = function (e) {
          // e.target.result look like "data:text/csv;base64,....."
          // We need to strip the prefix to get just the base64 string
          const result = e.target.result;
          const base64Content = result.split(',')[1];

          document.body.innerHTML = "<p>Uploading and processing... please wait.</p>";
          google.script.run
            .withSuccessHandler(result => {
              const added = (result && result.added) || 0;
              const skipped = (result && result.skipped) || 0;
              let msg = `Added ${added} transaction${added === 1 ? '' : 's'} to "${cardName}".`;
              if (skipped > 0) {
                msg += `\nSkipped ${skipped} duplicate${skipped === 1 ? '' : 's'}.`;
              }
              alert(msg);
              google.script.host.close();
            })
            .withFailureHandler(err => {
              alert('Error: ' + err.message);
              google.script.host.close();
            })
            .processUploadedCsv(base64Content, cardName);
        };
        // Read as Data URL generates the base64 string automatically
        reader.readAsDataURL(file);
      } else {
        alert('Please select a valid CSV file.');
        fileInput.value = "";
      }
    }
  </script>
</body>

</html>
